version: "3.9"

services:
  db:
    image: postgres:16
    container_name: fitflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow
      POSTGRES_DB: fitflow
    ports:
      - "5432:5432"
    volumes:
      - fitflow_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fitflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  fitflow_pg_data:
